name: Documentação e conhecimento

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      rag-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ta_pago_rag_test
          POSTGRES_USER: rag_test
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_test -d ta_pago_rag_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Validar documentação
        run: npm run docs:validate
      - name: Testar ferramentas documentais
        run: npm run docs:test
      - name: Verificar manifesto versionado
        run: npm run knowledge:check
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Validar inventário do código
        run: npm run code:check
      - name: Testar inventário do código
        run: npm run code:test
      - name: Testar recuperação, ingestão e answering RAG
        run: npm run rag:test
        env:
          RAG_TEST_DATABASE_URL: postgresql://rag_test:ci_test_only@127.0.0.1:5432/ta_pago_rag_test
