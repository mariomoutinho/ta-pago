plugins { id 'com.android.application' }

def signingFile = rootProject.file('../data/android-signing/release.json')
def signing = signingFile.exists() ? new groovy.json.JsonSlurper().parse(signingFile) : null

android {
    namespace 'br.com.coletivopindorama.tapago'
    compileSdk 36
    defaultConfig {
        applicationId 'br.com.coletivopindorama.tapago'
        minSdk 26
        targetSdk 36
        versionCode 10000
        versionName '1.0.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    if (signing != null) {
        signingConfigs { release {
            storeFile file(signing.storeFile)
            storePassword signing.storePassword
            keyAlias signing.keyAlias
            keyPassword signing.keyPassword
        } }
    }
    buildTypes {
        release {
            if (signing != null) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
}
dependencies { implementation 'androidx.webkit:webkit:1.14.0'; testImplementation 'junit:junit:4.13.2' }
